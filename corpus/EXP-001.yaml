    evidence_status: source-reported

  - id: WM-004
    system: genie
    family: interactive-generative-environment
    primary_source: https://arxiv.org/abs/2402.15391
    observation: "Genie learns an interactive generative environment from unlabelled Internet video using a video tokenizer, dynamics model and latent action model."
    ontology_relevance:
      physical: "source environments represented in video"
      interface: "conditioning modalities and latent actions"
      cognition: "latent dynamics/action representations"
      data: "unlabelled Internet video"
      symbolic: "text can condition generated environments"
    evidence_status: source-reported

  - id: WM-005
    system: embodied-world-model-survey
    family: embodied-ai
    primary_source: https://arxiv.org/abs/2510.16732
    observation: "The survey frames world models as internal simulators supporting perception, prediction, decision making and forward/counterfactual rollouts."
    ontology_relevance:
      physical: "environment dynamics"
      interface: "perception/action channels"
      cognition: "prediction, perception and decision making"
      data: "sensory observations and trajectories"
      symbolic: null
