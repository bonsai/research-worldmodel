experiment: EXP-001
status: collected
purpose: "Normalize heterogeneous World Model families before ontology evaluation."
records:
  - id: WM-001
    system: dreamer-v3
    family: model-based-rl
    primary_source: https://arxiv.org/abs/2301.04104
    observation: "DreamerV3 learns an environment model and improves behavior by imagining future scenarios."
    ontology_relevance:
      physical: "environment being modeled"
      interface: "sensory inputs and actions"
      cognition: "latent representations and imagined trajectories"
      data: "experience trajectories"
      symbolic: null
    evidence_status: source-reported

  - id: WM-002
    system: v-jepa
    family: latent-predictive
    primary_source: https://arxiv.org/abs/2404.08471
    observation: "V-JEPA learns visual representations by predicting latent video features from masked spatiotemporal context."
    ontology_relevance:
      physical: "visual dynamics represented in video"
      interface: "video observation stream"
      cognition: "learned latent feature representation"
      data: "video corpus"
      symbolic: null
    evidence_status: source-reported

  - id: WM-003
    system: v-jepa-2
    family: latent-predictive-embodied
    primary_source: https://arxiv.org/abs/2506.09985
    observation: "V-JEPA 2 combines web-scale video pretraining with an action-conditioned latent world model for robotic planning."
    ontology_relevance:
      physical: "physical robot manipulation world"
      interface: "video observations and robot trajectories"
      cognition: "understanding, prediction and planning representations"
      data: "internet video and robot video"
